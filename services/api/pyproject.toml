[project]
name = "formwise-api"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "pydantic-settings>=2.10,<3",
    "structlog>=25.4,<26",
    "firebase-admin>=7.1,<8",
    "httpx>=0.28,<1",
    "formwise-document-core",
    "formwise-worker",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
formwise-document-core = { workspace = true }
formwise-worker = { workspace = true }

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "httpx>=0.28,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "formwise-worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pydantic-settings>=2.10,<3", "structlog>=25.4,<26", "firebase-admin>=7.1,<8", "paddleocr>=3.0,<4", "pymupdf>=1.26,<2", "pillow>=11,<12", "formwise-document-core"]
[project.optional-dependencies]
dev = ["mypy>=1.17,<2", "pytest>=8.4,<9", "ruff>=0.12,<1"]
[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
ignore = ["E501"]
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
formwise-document-core = { workspace = true }

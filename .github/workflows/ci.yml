name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  python:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api
          - worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install workspace dependencies
        run: uv sync --all-packages --all-extras

      - name: Ruff
        run: |
          uv run --project services/${{ matrix.service }} \
            ruff check services/${{ matrix.service }}

      - name: MyPy
        run: |
          uv run --project services/${{ matrix.service }} \
            mypy \
            --config-file services/${{ matrix.service }}/pyproject.toml \
            services/${{ matrix.service }}/src

      - name: Run tests
        run: |
          uv run --project services/${{ matrix.service }} \
            pytest services/${{ matrix.service }}/tests
